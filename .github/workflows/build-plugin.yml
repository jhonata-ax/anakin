name: Compilar plugin RemNote
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.cjs'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-plugin.yml'
jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Format-Painter-BR-v2.0.9-PluginZip
          path: PluginZip.zip
          if-no-files-found: error
